<style>
/* Layout: one-screen raid. Rune strip on top, shield wall ringed by a fjord, docks, the harbor queue, a wooden button bar. */
:root {
  --ink: #d6e4ec;        /* morning sky over the fjord */
  --syrup: #f3e9d2;      /* parchment panels */
  --syrup-hi: #e3d3b0;   /* raised panels */
  --wood: #6b4a2e;       /* timber */
  --wood-hi: #8d6540;
  --cream: #2b2118;      /* ink-brown text */
  --mute: #6b5a48;       /* secondary text */
  --lemon: #c9922a;      /* gold accent */
  --danger: #c0392b;
  --scene: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 390 760%22 preserveAspectRatio=%22xMidYMid slice%22 %3E %3Cdefs%3E%3ClinearGradient id=%22skyG%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%236fb3e6%22/%3E%3Cstop offset=%221%22 stop-color=%22%23d7ecf7%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22seaG%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%235fb0d8%22/%3E%3Cstop offset=%221%22 stop-color=%22%232f7fb0%22/%3E%3C/linearGradient%3E%3C/defs%3E %3Crect width=%22390%22 height=%22760%22 fill=%22url(%23skyG)%22/%3E %3Ccircle cx=%22310%22 cy=%22110%22 r=%2234%22 fill=%22%23fff5c2%22 opacity=%22.9%22/%3E %3Cg fill=%22%23fff%22 opacity=%22.85%22%3E%3Cellipse cx=%2280%22 cy=%22120%22 rx=%2246%22 ry=%2216%22/%3E%3Cellipse cx=%22110%22 cy=%22112%22 rx=%2230%22 ry=%2218%22/%3E%3Cellipse cx=%22250%22 cy=%2270%22 rx=%2238%22 ry=%2213%22/%3E%3Cellipse cx=%22270%22 cy=%2262%22 rx=%2224%22 ry=%2215%22/%3E%3C/g%3E %3Cpath d=%22M-20 330 L60 200 L120 290 L180 180 L250 300 L300 230 L360 310 L420 250 L420 400 L-20 400 Z%22 fill=%22%236f8fb0%22/%3E %3Cpath d=%22M60 200 L80 232 L100 214 L120 290 Z M180 180 L200 214 L220 200 L250 300 Z M300 230 L316 256 L334 246 L360 310 Z%22 fill=%22%23f3f7fa%22 opacity=%22.9%22/%3E %3Cpath d=%22M-20 380 L40 300 L110 360 L170 310 L240 370 L320 320 L420 380 L420 440 L-20 440 Z%22 fill=%22%234e7f5a%22/%3E %3Cpath d=%22M-20 420 L420 420 L420 760 L-20 760 Z%22 fill=%22url(%23seaG)%22/%3E %3Cg stroke=%22%23fff%22 stroke-opacity=%22.35%22 stroke-width=%223%22 stroke-linecap=%22round%22 fill=%22none%22%3E%3Cpath d=%22M40 470 q20 -8 40 0%22/%3E%3Cpath d=%22M250 500 q20 -8 40 0%22/%3E%3Cpath d=%22M120 560 q20 -8 40 0%22/%3E%3Cpath d=%22M300 610 q20 -8 40 0%22/%3E%3Cpath d=%22M60 650 q20 -8 40 0%22/%3E%3C/g%3E %3Cpath d=%22M-20 690 Q120 650 260 690 T420 690 L420 760 L-20 760 Z%22 fill=%22%235fa05a%22/%3E %3Cpath d=%22M-20 720 Q140 690 300 722 T420 715 L420 760 L-20 760 Z%22 fill=%22%233d7a3f%22/%3E %3C/svg%3E");   /* the fjord: sky, mountains, water and a green shore, behind every screen */
  --planks: repeating-linear-gradient(90deg, #7a5234 0 46px, #6b4529 46px 48px), linear-gradient(#8d6540, #5a3b22);
  --display: 'Metamorphous', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --body: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  background: #2f7fb0 var(--scene) center / cover no-repeat; color: var(--cream); font-family: var(--body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; padding-inline: 10px; padding-block: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
.hud { display: flex; align-items: center; gap: 10px; }
.lvl { font-family: var(--display); font-size: 19px; letter-spacing: .02em; white-space: nowrap; color: #ffd37a; text-shadow: 0 2px 0 #4a3220, 0 0 6px rgba(0,0,0,.35); }
.bar { flex: 1; min-width: 0; height: 12px; background: #b9cbd6; border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.15); }
.bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #8d6540, var(--lemon)); border-radius: 99px; transition: width .25s; }
.chip { font-size: 13px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: var(--wood); color: #f3e9d2; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.easy { background: #2f7a4a; color: #e9ffe9; }
.chip.clock { background: #e3d3b0; color: #2b2118; }
.chip.clock.swift { background: #2f7a4a; color: #e9ffe9; }
.saga { text-align: left; max-height: 56vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.35; }
.saga .ach { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; background: #e3d3b0; }
.saga .ach.done { background: #d9ecd9; }
.saga .ach .sym { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--wood); color: #ffd37a; font-size: 17px; font-weight: 800; }
.saga .ach.done .sym { background: #2f7a4a; color: #fff; }
.saga .ach b { display: block; font-size: 14px; }
.saga .ach small { color: var(--mute); font-size: 12px; }
.saga .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-bottom: 1px dashed #c9b893; }
.saga .row b { font-variant-numeric: tabular-nums; }
.saga h3 { margin: 6px 0 2px; font-family: var(--display); font-weight: 400; font-size: 15px; color: var(--wood); }
.tabs { display: flex; gap: 6px; } .tabs button { flex: 1; border: 0; border-radius: 10px; padding: 8px 4px; font: 800 14px var(--body); background: #e3d3b0; color: var(--mute); cursor: pointer; } .tabs button.on { background: var(--wood); color: #ffd37a; }
.reward { background: #e3d3b0; border-radius: 12px; padding: 8px 10px; font-size: 14px; line-height: 1.5; color: var(--cream); }
.reward .new { color: #2f7a4a; font-weight: 800; }
.reward .rw { padding: 3px 0; } .reward .rw + .rw { border-top: 1px dashed rgba(0,0,0,.14); }
.task { display: flex; align-items: center; gap: 8px; background: var(--syrup-hi); border-radius: 12px; padding: 7px 10px; font-size: 14px; text-align: left; }
.task .tt { flex: 1; min-width: 0; } .task .tt small { display: block; color: var(--mute); font-size: 12px; }
.task .tb { height: 8px; border-radius: 99px; background: rgba(0,0,0,.15); overflow: hidden; margin-top: 4px; } .task .tb i { display: block; height: 100%; background: linear-gradient(#7ed957, #3f9c2e); }
.task.done { background: #cfe9c6; } .task .tgo { flex: none; font-size: 13px; padding: 6px 10px; }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--wood); color: #f3e9d2; font: 800 15px var(--body); cursor: pointer; flex: none; }
.stage { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
* { touch-action: none; -webkit-tap-highlight-color: transparent; }
.saga, .hblist, .mnscene, .mnsheet, .scroll, .saga *, .hblist *, .mnscene *, .mnsheet *, .scroll * { touch-action: pan-y; }
.card, .card * { touch-action: pan-y; }
[hidden] { display: none !important; } /* a hidden overlay or home screen must stay hidden even where its own display rule is set */
#home { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; background: #8ec5e8; overflow: hidden; touch-action: none; font-family: var(--body); }
#home .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
#home .top { position: relative; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 0; }
#home .pill { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 8px; border-radius: 99px; background: rgba(43, 33, 24, .78); color: #f3e9d2; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.25); border: 0; }
#home .pill .ic { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #f2d24b; color: #6b4a2e; font-size: 13px; line-height: 1; box-shadow: inset 0 -2px 0 #c9922a; }
#home .pill .ic.h { background: #e23a9e; color: #fff; border-radius: 6px; }
#home .pill small { font-weight: 700; opacity: .8; font-size: 12px; }
#home .cog { margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 14px; background: linear-gradient(#f3e9d2, #d9c3a3); color: #6b4a2e; font-size: 26px; line-height: 1; box-shadow: 0 4px 0 #8d6540; cursor: pointer; }
#home .cog:active { transform: translateY(2px); box-shadow: 0 2px 0 #8d6540; }
#home .build { position: absolute; top: calc(2px + env(safe-area-inset-top, 0px)); right: 8px; font-size: 10px; font-weight: 700; color: rgba(43,33,24,.55); }
#home .mid { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 16px 0; }
#home .badge { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: clamp(118px, 36vw, 160px); aspect-ratio: 1; border: 0; border-radius: 30%; background: radial-gradient(circle at 50% 35%, #e0a24f, #b8742a 70%); box-shadow: 0 7px 0 #7a4a1a, 0 10px 18px rgba(0,0,0,.25), inset 0 0 0 6px rgba(255,255,255,.18); color: #fff8ea; cursor: pointer; text-shadow: 0 3px 0 rgba(90,50,10,.6); }
#home .badge:active { transform: translateY(3px); box-shadow: 0 4px 0 #7a4a1a, 0 6px 12px rgba(0,0,0,.25), inset 0 0 0 6px rgba(255,255,255,.18); }
#home .badge small { font-family: var(--display); font-size: clamp(15px, 4.5vw, 20px); letter-spacing: .12em; }
#home .badge b { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 14vw, 64px); line-height: 1; }
#home .badge i { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font-style: normal; font-size: 10px; font-weight: 800; white-space: nowrap; padding: 2px 8px; border-radius: 99px; background: #2b2118; color: #ffd37a; }
#home .ship { width: min(78vw, 330px); height: auto; margin-top: 12px; filter: drop-shadow(0 6px 4px rgba(0,0,0,.2)); flex: none; }
#home .prog { display: flex; flex-direction: column; align-items: center; gap: 3px; width: min(70vw, 260px); }
#home .prog .bar { width: 100%; height: 10px; border-radius: 99px; background: rgba(43,33,24,.3); overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.2); }
#home .prog .bar i { display: block; height: 100%; background: linear-gradient(#ffd37a, #c9922a); }
#home .prog small { font-size: 12px; font-weight: 800; color: #2b2118; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
#home .playwrap { position: relative; display: flex; justify-content: center; padding: 14px 16px 10px; }
#home .homeplay { position: relative; width: min(82vw, 320px); min-height: 78px; border: 0; border-radius: 26px; background: linear-gradient(#7ed957, #3f9c2e); color: #fff; font-family: var(--display); font-size: 44px; line-height: 1; letter-spacing: .02em; text-shadow: 0 3px 0 #2d6e1f; box-shadow: 0 7px 0 #2d6e1f, 0 10px 14px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.35); cursor: pointer; }
#home .homeplay:active { transform: translateY(4px); box-shadow: 0 3px 0 #2d6e1f, 0 6px 10px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.35); }
#home .homeplay .ban { position: absolute; left: 50%; top: -16px; transform: translateX(-50%); padding: 5px 18px; border-radius: 10px; background: linear-gradient(#8d4f1c, #6b3a12); color: #ffd37a; font-family: var(--display); font-size: 17px; letter-spacing: .04em; box-shadow: 0 3px 0 #3d2a18; white-space: nowrap; }
#home .homeplay .ban.boss { background: linear-gradient(#b8262a, #7a1419); color: #fff; }
.navbar { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(#5b7fa6, #3f5f82); box-shadow: 0 -4px 0 #2d4560, 0 -8px 14px rgba(0,0,0,.2); }
.nav { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 4px; border: 0; border-radius: 16px; background: transparent; color: #e9f0f3; font-weight: 800; font-size: 12px; cursor: pointer; position: relative; }
.nav .ic { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 16px; background: linear-gradient(#f3e9d2, #d9c3a3); color: #6b4a2e; font-size: 28px; line-height: 1; box-shadow: 0 4px 0 #8d6540; }
.nav .ic svg { width: 32px; height: 32px; }
.nav.on { color: #fff; }
.nav.on .ic { background: linear-gradient(#ffe39a, #e0a24f); box-shadow: 0 4px 0 #a6702a, 0 0 0 3px #fff8ea; transform: translateY(-6px) scale(1.08); }
.nav:active .ic { transform: translateY(2px); box-shadow: 0 2px 0 #8d6540; }
.nav .n { position: absolute; top: 2px; right: 10%; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: #d9342f; color: #fff; font-size: 12px; font-weight: 900; line-height: 20px; text-align: center; box-shadow: 0 0 0 2px #fff; }
@media (max-height: 640px) { #home .ship { width: min(62vw, 240px); } #home .homeplay { min-height: 66px; font-size: 38px; } .nav .ic { width: 44px; height: 44px; font-size: 24px; } }
#lh .navbar, #hb .navbar { margin: 0 -10px calc(-6px - env(safe-area-inset-bottom, 0px)); }
@media (max-height: 720px) { .lhorder .perk { display: none; } .lhshelf .boost small { display: none; } .lhbar { height: 48px; } }
.boosters { display: flex; gap: 8px; align-items: flex-end; justify-content: center; padding: 10px 10px calc(8px + env(safe-area-inset-bottom, 0px)); margin: 4px -10px calc(-6px - env(safe-area-inset-bottom, 0px)); background: linear-gradient(#5b7fa6, #3f5f82); box-shadow: 0 -4px 0 #2d4560, 0 -8px 14px rgba(0,0,0,.2); }
.boosters .boost { flex: 0 1 120px; flex-direction: column; gap: 1px; padding: 6px 4px 5px; position: relative; background: linear-gradient(#f3e9d2, #d9c3a3); color: #6b4a2e; box-shadow: 0 4px 0 #8d6540; border-radius: 16px; }
.boosters .boost:active { box-shadow: 0 2px 0 #8d6540; }
.boosters .boost:disabled { opacity: .45; filter: grayscale(.6); }
.boosters .pi { font-size: 26px; line-height: 1; }
.boosters .pl { font-size: 12px; font-weight: 800; }
.boosters .boost b { position: absolute; top: -7px; right: 6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: #d9342f; color: #fff; font: 900 13px/22px var(--body); text-align: center; box-shadow: 0 0 0 2px #fff; }
.boost { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 14px; border: 0; cursor: pointer;
  background: linear-gradient(var(--wood-hi), var(--wood)); color: #f3e9d2; font: 800 15px var(--body); box-shadow: 0 4px 0 #3d2a18; }
.boost:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d2a18; }
.boost b { font-family: var(--display); font-weight: 400; font-size: 16px; color: #ffd37a; font-variant-numeric: tabular-nums; }
.boost.on { background: var(--lemon); color: #2b2118; }
.boost.on b { color: #2b2118; }
.boost[disabled] { opacity: .4; }
button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 60, 80, .55); padding-inline: 16px; z-index: 7; }
.card { width: 100%; max-width: 360px; max-height: calc(100vh - 24px); max-height: calc(var(--vh, 100vh) - 24px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--syrup); border: 3px solid var(--wood-hi); border-radius: 18px; padding: 24px 22px; text-align: center; box-shadow: 0 10px 0 #4a3220; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.05; text-wrap: balance; color: var(--lemon); }
.card p { margin: 0; color: var(--mute); font-size: 16px; line-height: 1.45; }
.card ul { margin: 0; padding: 0; list-style: none; overflow: auto; min-height: 0; touch-action: pan-y; text-align: left; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.4; }
.card li { display: flex; gap: 10px; }
.card li span { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--wood); font-weight: 800; font-size: 12px; color: #ffd37a; }
.cta { border: 0; border-radius: 14px; padding: 14px; font: 400 19px var(--display); letter-spacing: .02em; background: var(--lemon); color: #2b2118; cursor: pointer; box-shadow: 0 5px 0 #8c6a20; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #8c6a20; }
.link { background: none; border: 0; color: var(--mute); font: 800 14px var(--body); cursor: pointer; padding: 4px; }
.toast { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #2f7a4a; color: #f1fff3; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 12px; max-width: calc(100% - 20px); text-align: center; z-index: 4; transition: opacity .4s; pointer-events: none; box-sizing: border-box; }
/* the Longhouse: a merge board on its own screen */
#lh { touch-action: none; position: absolute; inset: 0; z-index: 6; background: var(--planks); display: flex; flex-direction: column; gap: 6px; padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; max-width: 560px; margin: 0 auto; }
#lh .hud .lvl { flex: 1; }
.lhorder { background: var(--syrup); border: 2px solid var(--wood-hi); border-radius: 14px; padding: 8px 10px; font-size: 13px; line-height: 1.35; }
.lhorder b.h { font-family: var(--display); font-weight: 400; font-size: 17px; color: var(--wood); }
.lhorder .perk { color: var(--mute); font-size: 12px; margin-top: 3px; }
.lhorder .wants { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.want { display: flex; align-items: center; gap: 4px; background: #e3d3b0; border-radius: 9px; padding: 3px 7px; font-weight: 800; font-size: 12px; }
.want.met { background: #d9ecd9; text-decoration: line-through; }
.want .wa { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; } .want .wa svg { width: 16px; height: 16px; display: block; }
.lhgrid { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: repeat(12, var(--c, 30px)); grid-auto-rows: var(--c, 30px); gap: 3px; align-content: center; justify-content: center; touch-action: none; }
.lhcell { position: relative; background: #c9b893; border-radius: 10px; box-shadow: inset 0 2px 0 rgba(0,0,0,.08); }
.lhcell.drop { box-shadow: inset 0 0 0 3px #ffd37a; animation: dropglow 1.6s ease-in-out infinite; }
@keyframes dropglow { 50% { box-shadow: inset 0 0 0 3px rgba(255, 211, 122, .35); } }
.lhcell.qT { background: #d9c3a3; } .lhcell.qI { background: #bfc6cc; } .lhcell.qF { background: #e6cf98; } .lhcell.qW { background: #e4ddd3; }
.lhcell[data-q]::before { content: attr(data-q); position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--c, 30px) * .6); opacity: .22; }
.lhcell { border-radius: calc(var(--c, 30px) * .22); }
.piece svg { width: 78%; height: 78%; display: block; }
.piece.pop { animation: pop .42s cubic-bezier(.2, 1.4, .4, 1) both; }
.piece.merge { animation: mergepop .5s ease-out both; }

// ---------- seeded rng ----------
function rngFrom(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

function proceduralGrid(n, rng) {
  // portrait boards: phones are taller than wide, so the wall grows downward more than sideways
  const C = Math.min(10, 7 + Math.floor(n / 4)), R = Math.min(14, C + 2 + ri(rng, 0, 2));
  const k = Math.min(2 + Math.floor((n + 1) / 4), 6);
  const pool = PROC_COLORS.slice().sort(() => rng() - .5).slice(0, k);
  const type = (n < 12 ? [0, 2, 5] : n < 20 ? [0, 2, 5, 1] : [0, 0, 2, 2, 5, 5, 1, 3, 4])[ri(rng, 0, n < 12 ? 2 : n < 20 ? 3 : 8)], cx = (C - 1) / 2, cy = (R - 1) / 2;
  const seeds = Array.from({ length: k * 2 }, () => [rng() * C, rng() * R]);
  const sw = ri(rng, 1, 2), mask = ri(rng, 0, 2), noise = Math.max(0, Math.min(.02 + (n - 10) * .006, .12));
  const g = [];
  for (let r = 0; r < R; r++) { const row = []; for (let c = 0; c < C; c++) {
    const dx = c - cx, dy = r - cy; let idx;
    if (type === 0) idx = Math.floor(Math.max(Math.abs(dx), Math.abs(dy)) / sw);
    else if (type === 1) idx = Math.floor((c + r) / (sw + 1));
    else if (type === 2) idx = Math.floor((Math.abs(dx) + Math.abs(dy)) / (sw + .5));
    else if (type === 3) { let best = 1e9; seeds.forEach((s, i) => { const d = (s[0] - c) ** 2 + (s[1] - r) ** 2; if (d < best) { best = d; idx = i; } }); }
    else if (type === 4) idx = (Math.floor(c / (sw + 1)) + Math.floor(r / (sw + 1)) * 2);
    else idx = Math.floor(Math.hypot(dx, dy) / (sw + .4));
    let ch = rng() < noise ? pool[ri(rng, 0, k - 1)] : pool[idx % k];
    if (mask === 1 && dx * dx / (cx + .6) ** 2 + dy * dy / (cy + .6) ** 2 > 1) ch = '.';
    if (mask === 2 && Math.abs(dx) + Math.abs(dy) > Math.max(cx, cy) + 1.5) ch = '.';
    row.push(ch);
  } g.push(row.join('')); }
  return g;
}

function parseGrid(rows) {
  const C = Math.max(...rows.map(r => r.length));
  let g = rows.map(r => r.padEnd(C, '.').split('').map(ch => ch === '.' ? null : ch));
  g = g.filter(r => r.some(Boolean));
  const used = c => g.some(r => r[c]);
  let c0 = 0, c1 = C - 1; while (c0 < c1 && !used(c0)) c0++; while (c1 > c0 && !used(c1)) c1--;
  return g.map(r => r.slice(c0, c1 + 1));
}

// cells reachable by a shot from any side

      ? `<h2>Valhalla!</h2><p>All ${MAX_LEVEL} raids won. The skalds will sing of this for a thousand years.</p>`
      : `<h2>Raid ${n} won!</h2><p>${(save.fails[n] || 0) ? `Took ${save.fails[n] + 1} tries.` : 'First try!'}${difficulty(n + 1).boss ? ' A great raid is next: a bigger wall and heavier defenses.' : ' The next shield wall awaits.'}</p>
      ${rewardHtml(S.reward)}<button class="cta" id="go">Raid ${n + 1}</button>${chestCount() ? `<button class="link" id="toLH" style="background:var(--wood);color:#ffd37a;border-radius:12px;padding:10px 14px;font-size:15px">Open ${chestCount()} chest${chestCount() > 1 ? 's' : ''} in the Longhouse</button>` : ''}`;
    setTimeout(() => { const b = $('toLH'); if (b) b.onclick = () => openLH('win'); });
  } else if (kind === 'lose') {
    html = S.lossWhy === 'ships'
      ? `<h2>Stranded</h2><p>No ship is left to throw an axe, yet shields remain. Raid ${n} just got a little easier for your next try.</p>`
      : `<h2>Docks are full</h2><p>A ship came home and every dock was taken. Raid ${n} just got a little easier for your next try.</p>`;
    if (S.hornSaved) html += `<div class="reward"><span class="new">A Mead Horn saved your streak of ${SAGA.streak}.</span> ${SAGA.horns} left.</div>`;
    else if (S.streakLost) html += `<div class="reward">Your streak of ${S.streakLost} ends here. A new one starts with the next first-try win.${sixthSail() ? '' : S.streakLost >= 3 ? ' The Sixth Sail is furled until then.' : ''}</div>`;
    html += `<button class="cta" id="go">Try again</button>`;
  } else if (kind === 'menu') {
    const sw = (on) => `<b style="float:right;font-family:var(--display);color:${on ? '#ffd37a' : '#b9a98f'}">${on ? 'On' : 'Off'}</b>`;
    const row = (id, label, on) => `<button class="link" id="${id}" style="display:block;width:100%;text-align:left;background:var(--wood);color:#f3e9d2;border-radius:12px;padding:10px 14px;font-size:16px">${label}${sw(on)}</button>`;
    const btn = (id, label, bg, fg) => `<button class="link" id="${id}" style="display:block;width:100%;text-align:center;background:${bg};color:${fg};border-radius:12px;padding:12px 14px;font-size:16px">${label}</button>`;
    html = `<h2>Raid ${n}</h2>${btn('retreat', `Retreat from raid ${n}`, '#8d4f1c', '#f3e9d2')}${btn('tHome', 'Home', 'var(--wood-hi)', '#f3e9d2')}${btn('tSet', 'Settings', 'var(--wood)', '#f3e9d2')}
      <p style="margin:4px 0 0;font-size:12px;opacity:.65;line-height:1.5">Version ${BUILD}${window.VR_UPDATE ? ` · Update ${window.VR_UPDATE.id}` : ' · Claude page'}<br>${matchMedia('(display-mode: standalone)').matches || navigator.standalone ? 'Installed app' : 'In the browser'}<span id="upd"></span></p><button class="cta" id="cancel">Back to the raid</button>`;
    setTimeout(() => {
      $('retreat').onclick = () => showCard('restart');
      $('tSet').onclick = () => showCard('settings');
      $('tHome').onclick = () => showHome();
      // the installed app asks the web host which version is current
      if (window.VR_UPDATE) fetch('version.json', { cache: 'no-store' }).then(r => r.json()).then(v => { const el = $('upd'); if (!el) return;
        el.textContent = v.build === BUILD ? ' · up to date' : ` · ${v.build} is out: close the app fully and open it again`; }).catch(() => {});
    });
  } else if (kind === 'lhHelp') {
    html = `<h2>The Longhouse</h2><p style="margin:0 0 8px;color:var(--mute);font-size:14px">A merge puzzle. Winning raids gives you chests of pieces. Merge pieces to make better ones, deliver them to build halls, and each hall gives your raids a bonus.</p><ul>
      <li><span>1</span><div><b>Tap a chest for tokens.</b> Each chest gives a random number: wooden 1 to 3, iron 2 to 5, silver 4 to 8, gold 7 to 12. Tap any empty dashed cell to place each token: it becomes that corner's kind (timber, iron, food or wool) and keeps it until you sell or deliver it.</div></li>
      <li><span>2</span><div><b>Drag a piece onto one just like it.</b> The two become one better piece. Dragging onto a different piece swaps them.</div></li>
      <li><span>3</span><div><b>Tap a piece, then Deliver.</b> The hall at the top needs the pieces it shows. Finish a hall and your raids get a reward.</div></li>
      <li><span>4</span><div><b>Glowing pieces</b> are the ones the hall wants right now. A level VI piece is the top: tap it for a tribute (a dock token and silver).</div></li>
      <li><span>5</span><div><b>Board full?</b> Tap a piece and Sell it for silver.</div></li>
      <li><span>6</span><div><b>Every hall built?</b> Raise a runestone: start over with a quarter more silver from everything, forever.</div></li></ul>
      <button class="cta" id="lhOk">Let's build</button>`;
    setTimeout(() => { const b = $('lhOk'); if (b) b.onclick = () => { $('ov').hidden = true; }; });
  } else if (kind === 'settings') {
    const sw2 = on => `<b style="float:right;font-family:var(--display);color:${on ? '#ffd37a' : '#b9a98f'}">${on ? 'On' : 'Off'}</b>`;
    const row2 = (id, label, on) => `<button class="link" id="${id}" style="display:block;width:100%;text-align:left;background:var(--wood);color:#f3e9d2;border-radius:12px;padding:10px 14px;font-size:16px">${label}${sw2(on)}</button>`;
    html = `<h2>Settings</h2>${row2('sSym', 'Shield symbols', save.symbols === true)}${row2('sMusic', 'Music', save.music)}${row2('sSound', 'Sound effects', !save.muted)}${row2('sVibe', 'Vibration', save.vibe)}${row2('sClock', 'Hourglass (from raid 11)', save.clock !== false)}
      <button class="link" id="sHow" style="display:block;width:100%;text-align:center;background:var(--wood-hi);color:#f3e9d2;border-radius:12px;padding:10px 14px;font-size:16px">How to play</button>
      <button class="link" id="sWipe" style="color:#f3e9d2;background:#8e2a1e;border-radius:12px;padding:8px 14px;font-size:14px">Erase all progress and start over</button>
      <p style="margin:4px 0 0;font-size:12px;opacity:.65;line-height:1.5">Version ${BUILD}</p><button class="cta" id="cancel">Back</button>`;
    setTimeout(() => {
      $('sSym').onclick = () => { save.symbols = save.symbols !== true; persist(); showCard('settings'); };
      $('sMusic').onclick = () => { save.music = !save.music; persist(); music(); showCard('settings'); };
      $('sSound').onclick = () => { save.muted = !save.muted; persist(); showCard('settings'); };
      $('sVibe').onclick = () => { save.vibe = !save.vibe; persist(); if (save.vibe) buzz(); showCard('settings'); };
      $('sClock').onclick = () => { save.clock = save.clock === false ? null : false; persist(); showCard('settings'); };
      $('sWipe').onclick = () => showCard('wipe');
      $('sHow').onclick = () => showCard('howto');
    });
  } else if (kind === 'wipe') {
    html = `<h2>Erase everything?</h2><ul>
      <li><span>!</span><div><b>This cannot be undone.</b> Raid ${save.level}, every achievement and stat, ${fmtN(SAGA.silver)} silver, the Longhouse, the Harbor, chests, horns, tokens and runestones all go.</div></li>
      <li><span>!</span><div>The game starts again from raid 1, as if just installed.</div></li></ul>
      <button class="cta" id="wipeGo" style="background:#8e2a1e;color:#f3e9d2">Yes, erase everything</button><button class="link" id="cancel">Keep my saga</button>`;
    setTimeout(() => { const b = $('wipeGo'); if (b) b.onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); }; });
  } else if (kind === 'rune') {
    html = `<h2>Raise a runestone</h2><ul>
      <li><span>+</span><div><b>Forever:</b> a quarter more silver from raids, the harbor, taps and deliveries. Now x${runeMult().toFixed(2)}, after this x${(runeMult() + .25).toFixed(2)}.</div></li>
      <li><span>!</span><div><b>Starts over:</b> the longhouse board and halls (and their perks), every harbor building, the barrel, and your silver.</div></li>
      <li><span>=</span><div><b>Stays:</b> chests, dock tokens, Mead Horns, boons, achievements, stats and your raids.</div></li></ul>
      <button class="cta" id="runeGo">Raise runestone ${SAGA.runes + 1}</button><button class="link" id="runeNo">Not yet</button>`;
    setTimeout(() => { $('runeGo').onclick = raiseRune; $('runeNo').onclick = () => { $('ov').hidden = true; }; });
  } else if (kind === 'mnHelp') {
    html = `<h2>The Silver Mine</h2><p style="margin:0 0 8px;color:var(--mute);font-size:14px">An idle mine under the mountain. The miners never stop: each shaft piles up silver. The hoist lifts it to the pithead, the carts carry it to the longhouse, and only then is it yours.</p><ul>
      <li><span>1</span><div><b>Tap the hoist tower</b> and the cage goes down for a load. Tap the longhouse and a cart carries a load across. Each can only carry as much as its level allows, so keep them upgraded as the shafts get richer. A tap on a shaft spurs the miners.</div></li>
      <li><span>2</span><div><b>Tap a Level badge</b> to upgrade that part: one level at a time, ten, fifty or as many as you can afford. Every 25th level doubles it.</div></li>
      <li><span>3</span><div><b>Hire a foreman</b> for the hoist or the carts and they run on their own, even while the app is closed. A shaft foreman makes its miners dig twice as fast. Dig new shafts: the deeper ones are richer.</div></li>
      <li><span>4</span><div><b>Sell the mine</b> once it has earned enough. You get a deed, start a fresh mine, and every deed makes all your mines dig half again as fast, forever.</div></li></ul>
      <button class="cta" id="mnOk">To the mine</button>`;
    setTimeout(() => { const b = $('mnOk'); if (b) b.onclick = () => { $('ov').hidden = true; }; });
  } else if (kind === 'hbHelp') {
    html = `<h2>The Harbor</h2><p style="margin:0 0 8px;color:var(--mute);font-size:14px">A tap-to-earn game. Silver is the money. Tap the barrel to earn some, build the harbor so it earns on its own, and spend it on help for your raids.</p><ul>
      <li><span>1</span><div><b>Tap the barrel</b> at the bottom for silver. Quick taps build a catch streak: taps pay up to triple and the buildings work double while it lasts.</div></li>
      <li><span>2</span><div><b>Build the harbor.</b> Each building earns silver every minute, and half as much while the app is closed. Prices rise as the harbor grows.</div></li>
      <li><span>3</span><div><b>Spend silver on raids:</b> extra hammers and catapults, dock tokens, Mead Horns, and chests for the Longhouse.</div></li>
      <li><span>4</span><div><b>Buy upgrades</b> once a building is big enough: each doubles it. A Barrel crew taps for you.</div></li>
      <li><span>5</span><div><b>Reach level ${CHARTER_HB}</b> and sell the harbor for a charter: start over earning a quarter more here, forever. With every hall built and level ${RUNE_HB}, a runestone does the same for everything.</div></li></ul>
      <button class="cta" id="hbOk">To the harbor</button>`;
    setTimeout(() => { const b = $('hbOk'); if (b) b.onclick = () => { $('ov').hidden = true; }; });
  } else if (kind === 'saga') {
    const tab = (extra && extra.tab) || 'chap';
    let body = '';
    if (tab === 'ach') {
      body = ACH.map(a => { const t = SAGA.ach[a.id] || 0, done = t >= a.tiers.length, next = done ? null : a.tiers[t], v = STATS[a.key] || 0;
        return `<div class="ach${t ? ' done' : ''}"><div class="sym">${a.sym}</div><div><b>${a.name}${t ? ' ' + TIER_NAME[t - 1] : ''}</b><small>${a.desc}${done ? ': all done' : `: ${a.key === 'silverAll' || a.key === 'reach' ? v.toLocaleString() : v} of ${next.toLocaleString()}`}${a.chest || a.silver ? ' \u00b7 ' + (done ? '' : a.chest ? CHEST_NAME[a.chest[t]] : a.silver[t] + ' silver') : ''}</small></div></div>`; }).join('');
    } else {
      const r = (k, v) => `<div class="row"><span>${k}</span><b>${v}</b></div>`, st = STATS, rec = S ? raidRec(S.n) : null;
      const rate = st.wins ? Math.round(100 * st.first / Math.max(1, st.first + st.retry)) : 0;
      body = `<h3>Raiding</h3>${r('Raids won', st.wins)}${r('Highest raid reached', st.reach)}${r('First-try wins', st.first)}${r('Retry wins', st.retry)}${r('First-try rate', rate + '%')}${r('Lost: stranded', st.lossShips)}${r('Lost: docks full', st.lossFull)}${r('Retreats', st.retreats)}
        <h3>Streaks</h3>${r('Current streak', SAGA.streak)}${r('Best streak', st.best)}${r('Mead Horns held', SAGA.horns + ' of ' + HORN_MAX)}${r('Horns earned / used', st.hornsEarned + ' / ' + st.hornsUsed)}${r('Sixth Sail', sixthSail() ? 'Hoisted' : 'Furled')}
        <h3>Time</h3>${r('Raids beaten under par', st.swift)}${r('Own bests beaten', st.ownBest)}${r('Time raiding', fmtT(st.time))}
        <h3>Fighting</h3>${r('Axes thrown', st.axes)}${r('Shields broken', st.shields)}${r('Ships sailed', st.sailed)}${r('Lashed pairs sailed', Math.floor(st.lashed / 2))}${r('Full-load dock sailings', st.fullLoad)}${r('Hammers used', st.hammers)}${r('Catapults used', st.catapults)}
        <h3>Treasure</h3>${r('Silver in the purse', SAGA.silver)}${r('Silver earned all time', st.silverAll)}${r('Chests', Object.keys(CHEST_NAME).map(k => `${SAGA.chests[k] || 0} ${k}`).join(', '))}
        <h3>Longhouse and Harbor</h3>${r('Chests opened', st.chestsOpened)}${r('Merges', st.merges3)}${r('Top-tier pieces made', st.merges5)}${r('Pieces delivered', st.delivered)}${r('Halls finished', st.halls + ' of ' + HALLS.length)}${r('Runestones raised', st.runes)}${r('Dock tokens used', st.tokensUsed)}${r('Harbor income', fmtR(hbRate() / 60) + ' a second')}${r('Barrel taps', st.taps)}${r('Best haul while away', fmtN(st.haul))}${r('Silver mined', fmtN(st.ore))}${r('Mine deeds', st.deeds)}${r('Harbor charters', st.charters)}
        ${rec ? `<h3>Raid ${S.n}</h3>${r('Tries', rec.t)}${r('Wins', rec.w)}${r('Best time', rec.b ? fmtT(rec.b) : '\u2014')}${r('Par', fmtT(S.par))}${r('Under par', rec.s ? 'Yes \u2605' : 'Not yet')}${r('Hammers / catapults used', rec.h + ' / ' + rec.c)}` : ''}
        <p style="font-size:12px;margin-top:6px">Counting since ${SAGA.since}. Raids won before then count as wins, not as first tries.</p>`;
    }
    if (tab === 'chap') {
      body = ''; for (let k = 1; k <= SAGA.chapter + 1 && k <= Math.ceil(MAX_LEVEL / 10); k++) { const open = k <= SAGA.chapter, T = chapTasks(k);
        body += `<div class="ach${open ? ' done' : ''}"><div class="sym">${open ? '\u2713' : '\u2691'}</div><div><b>Chapter ${k}: ${chapName(k)}</b><small>${chapBeat(k)}${open ? '' : ' \u00b7 ' + T.map(t => `${t.text} (${Math.min(t.have, t.need)}/${t.need})`).join('; ')}</small></div></div>`; }
    }
    html = `<h2>Saga</h2><div class="tabs"><button id="tabC" class="${tab === 'chap' ? 'on' : ''}">Chapters</button><button id="tabA" class="${tab === 'ach' ? 'on' : ''}">Achievements</button><button id="tabS" class="${tab === 'stats' ? 'on' : ''}">Stats</button></div><div class="saga">${body}</div><button class="link" id="cancel">Close</button>`;
    setTimeout(() => { $('tabC').onclick = () => showCard('saga', { tab: 'chap' }); $('tabA').onclick = () => showCard('saga', { tab: 'ach' }); $('tabS').onclick = () => showCard('saga', { tab: 'stats' }); });
  } else if (kind === 'restart') {
    html = `<h2>Retreat and retry?</h2><p>${S.launched ? 'This counts as a try, so the raid will ease up a little.' : 'You have not launched a ship yet.'}</p>
      <button class="cta" id="go">Retreat</button><button class="link" id="cancel">Keep raiding</button>`;
  } else if (kind === 'intro') {
    const txt = { ice: ['Frozen shields', 'A shield rimed with ice needs one extra axe from its color. The first axe cracks the ice, the next one smashes the shield.'],
      mystery: ['Fogbound ships', 'A ship in fog hides its sail color until it reaches the front of its line, so you cannot plan far ahead around it.'],
      link: ['Lashed ships', 'Two ships roped together always launch as a pair, so the fjord needs room for both. Later the rope can cross two lines: then both ships must be at the front of their lines before either can sail.'],
      glacier: ['Glaciers', 'An ice sheet covers part of the wall and swallows every axe thrown at it. Break the number of shields shown on it, in its color, anywhere on the wall, and it calves away.'],
      reinf: ['The tide', 'Every eighth ship you send, the tide turns and one harbor line is reshuffled, so the ship you were saving may not be where you left it.'] };
    html = `<h2>New on raid ${n}</h2><ul>${extra.map(k => `<li><span>!</span><div><b>${txt[k][0]}.</b> ${txt[k][1]}</div></li>`).join('')}</ul><button class="cta" id="go">Got it</button>`;
  } else if (kind === 'chapter') {
    const k = SAGA.chapter + 1, T = chapTasks(k), done = chapDone(k);
    html = `<h2>Chapter ${k}: ${chapName(k)}</h2><p style="margin:0 0 8px;color:var(--mute);font-size:14px;font-style:italic">${chapBeat(k)}</p><p style="margin:0 0 8px;font-size:14px">The jarl's tasks before raids ${(k - 1) * 10 + 1} to ${k * 10} open:</p>
      ${T.map((t, i) => `<div class="task${t.have >= t.need ? ' done' : ''}"><div class="tt">${t.have >= t.need ? '\u2713 ' : ''}${t.text}<small>${Math.min(t.have, t.need)} of ${t.need}</small><div class="tb"><i style="width:${Math.min(100, t.have / t.need * 100)}%"></i></div></div>${t.go && t.have < t.need ? `<button class="boost tgo" data-go="${t.go}">${t.go === 'lh' ? 'Longhouse' : 'Harbor'}</button>` : ''}</div>`).join('')}
      <p style="margin:6px 0 0;font-size:13px;color:var(--mute)">Reward: a silver chest and ${rs(50 * k)} silver. Tap the barrel in the Harbor for silver, and buy Longhouse tokens with it.</p>
      <button class="cta" id="sail" ${done ? '' : 'disabled'} style="${done ? '' : 'opacity:.5'}">${done ? 'Set sail' : 'Tasks remain'}</button><button class="link" id="cancel">Back</button>`;
    setTimeout(() => { card.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { $('ov').hidden = true; $('home').hidden = true; homeOpen = true; if (b.dataset.go === 'lh') openLH('home'); else openHB(); }); const sb = $('sail'); if (sb) sb.onclick = () => { if (chapDone(k)) unlockChapter(); }; });
  } else if (kind === 'story') {
    const k = extra.k;
    html = `<h2>${chapName(k)}</h2><p style="font-style:italic">${chapBeat(k)}</p><div class="reward"><div class="rw"><span class="new">Chapter ${k} opens:</span> raids ${(k - 1) * 10 + 1} to ${k * 10}</div><div class="rw">+1 silver chest, +${rs(50 * k)} silver</div></div><button class="cta" id="storyGo">Raid ${(k - 1) * 10 + 1}</button>`;
    setTimeout(() => { $('storyGo').onclick = () => { $('ov').hidden = true; startLevel(Math.max(save.level, (k - 1) * 10 + 1)); }; });
  } else if (kind === 'charter') {
    html = `<h2>Sell the harbor?</h2><p style="font-size:14px">Every building, the barrel and its upgrades go back to nothing. In return you hold ${HB.charters + charterGain()} charter${HB.charters + charterGain() > 1 ? 's' : ''}: everything in the harbor earns x${(1 + .25 * (HB.charters + charterGain())).toFixed(2)} from now on, forever. Your silver, chests, Mead Horns and runestones stay.</p><button class="cta" id="charterGo">Sell for ${charterGain()} charter${charterGain() > 1 ? 's' : ''}</button><button class="link" id="cancel">Not yet</button>`;
    setTimeout(() => { $('charterGo').onclick = () => { $('ov').hidden = true; sellCharter(); }; });
  } else if (kind === 'runePick') {
    const left = RUNE_BOONS.filter(b => !boonOn(b.id));
    html = `<h2>Choose a rune boon</h2><p style="margin:0 0 8px;color:var(--mute);font-size:14px">Runestone ${SAGA.runes} grants one boon, forever:</p>${left.map(b => `<button class="link" data-rb="${b.id}" style="display:block;width:100%;text-align:left;background:var(--wood);color:#f3e9d2;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.3"><b>\u16B1 ${b.name}</b><br><small style="opacity:.85">${b.what}</small></button>`).join('')}`;
    setTimeout(() => { card.querySelectorAll('[data-rb]').forEach(b => b.onclick = () => { SAGA.runeBoons[b.dataset.rb] = true; persist(); $('ov').hidden = true; toast(`${RUNE_BOONS.find(x => x.id === b.dataset.rb).name} is yours, for good.`); if (!$('lh').hidden) lhRender(); if (hbLive()) hbRender(); }); });
  } else if (kind === 'levels') {
    const page = Math.max(0, Math.min(Math.floor(((extra && extra.page != null ? extra.page : (save.level - 1) / 50))), Math.floor((MAX_LEVEL - 1) / 50)));
    let b = ''; for (let i = page * 50 + 1; i <= Math.min(MAX_LEVEL, page * 50 + 50); i++) { const open = i <= save.level && raidOpen(i); b += `<button class="link" data-l="${i}" ${open ? '' : 'disabled'} style="font-family:var(--display);font-size:15px;color:${open ? '#f3e9d2' : '#b9a98f'};background:${open ? 'var(--wood)' : '#e6dcc6'};border-radius:10px;padding:7px 0">${i}</button>`; }
    html = `<h2>Saga ${page + 1}: raids ${page * 50 + 1} to ${page * 50 + 50}</h2><div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px"><button class="link" id="pgPrev" ${page ? '' : 'disabled'}>&larr; Earlier</button><button class="link" id="pgNext" ${page < Math.floor((MAX_LEVEL - 1) / 50) ? '' : 'disabled'}>Later &rarr;</button></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:46vh;overflow:auto" class="scroll">${b}</div><button class="link" id="cancel">Close</button>`;
    setTimeout(() => { const pv = $('pgPrev'), nx = $('pgNext'); if (pv) pv.onclick = () => showCard('levels', { page: page - 1 }); if (nx) nx.onclick = () => showCard('levels', { page: page + 1 }); });
  }
  card.innerHTML = html; $('ov').hidden = false;
  const go = $('go'), again = $('again'), cancel = $('cancel');
  if (go) go.onclick = () => {
    unlockAudio(); $('ov').hidden = true; save.seenHelp = true; persist();
    if (kind === 'intro') { (extra || []).forEach(k => { save.seen[k] = true; }); persist(); S.mode = 'play'; return; } // seen only once read, so the card is not lost behind the home screen at boot
    if (kind === 'win') startLevel(n + 1);
    else if (kind === 'restart') { if (S.launched) { save.fails[n] = (save.fails[n] || 0) + 1; STATS.retreats++; STATS.time += S.t; persist(); } startLevel(n); }
    else startLevel(kind === 'help' && S ? S.n : n);
  };
  if (again) again.onclick = () => { $('ov').hidden = true; startLevel(n); };
  if (cancel) cancel.onclick = () => { $('ov').hidden = true; if (S && S.mode === 'paused') S.mode = S.resumeMode || (prevMode === 'paused' ? 'play' : prevMode); S.resumeMode = null; };
  card.querySelectorAll('[data-l]').forEach(btn => btn.onclick = () => { $('ov').hidden = true; startLevel(+btn.dataset.l); });
