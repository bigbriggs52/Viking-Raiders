}

.stage { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
* { touch-action: none; -webkit-tap-highlight-color: transparent; }
.saga, .hblist, .scroll, .saga *, .hblist *, .scroll * { touch-action: pan-y; }

.tabs { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(#5b7fa6, #3f5f82); box-shadow: 0 -4px 0 #2d4560, 0 -8px 14px rgba(0,0,0,.2); }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 4px; border: 0; border-radius: 16px; background: transparent; color: #e9f0f3; font-weight: 800; font-size: 12px; cursor: pointer; position: relative; }
.tab .ic { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 16px; background: linear-gradient(#f3e9d2, #d9c3a3); color: #6b4a2e; font-size: 28px; line-height: 1; box-shadow: 0 4px 0 #8d6540; }

.tab:active .ic { transform: translateY(2px); box-shadow: 0 2px 0 #8d6540; }
.tab .n { position: absolute; top: 2px; right: 10%; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: #d9342f; color: #fff; font-size: 12px; font-weight: 900; line-height: 20px; text-align: center; box-shadow: 0 0 0 2px #fff; }

#lh .tabs, #hb .tabs { margin: 0 -10px calc(-6px - env(safe-area-inset-bottom, 0px)); }
@media (max-height: 720px) { .lhorder .perk { display: none; } .lhshelf .boost small { display: none; } .lhbar { height: 48px; } }
.boosters { display: flex; gap: 8px; align-items: flex-end; justify-content: center; padding: 10px 10px calc(8px + env(safe-area-inset-bottom, 0px)); margin: 4px -10px calc(-6px - env(safe-area-inset-bottom, 0px)); background: linear-gradient(#5b7fa6, #3f5f82); box-shadow: 0 -4px 0 #2d4560, 0 -8px 14px rgba(0,0,0,.2); }
.boosters .boost { flex: 0 1 120px; flex-direction: column; gap: 1px; padding: 6px 4px 5px; position: relative; background: linear-gradient(#f3e9d2, #d9c3a3); color: #6b4a2e; box-shadow: 0 4px 0 #8d6540; border-radius: 16px; }

.boost { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 14px; border: 0; cursor: pointer;
  background: linear-gradient(var(--wood-hi), var(--wood)); color: #f3e9d2; font: 800 15px var(--body); box-shadow: 0 4px 0 #3d2a18; }
.boost:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d2a18; }

.boost.on { background: var(--lemon); color: #2b2118; }

button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 60, 80, .55); padding-inline: 16px; z-index: 7; }
.card { width: 100%; max-width: 360px; max-height: calc(100vh - 24px); max-height: calc(var(--vh, 100vh) - 24px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--syrup); border: 3px solid var(--wood-hi); border-radius: 18px; padding: 24px 22px; text-align: center; box-shadow: 0 10px 0 #4a3220; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }

.cta { border: 0; border-radius: 14px; padding: 14px; font: 400 19px var(--display); letter-spacing: .02em; background: var(--lemon); color: #2b2118; cursor: pointer; box-shadow: 0 5px 0 #8c6a20; }

/* the Longhouse: a merge board on its own screen */
#lh { touch-action: none; position: absolute; inset: 0; z-index: 6; background: var(--planks); display: flex; flex-direction: column; gap: 6px; padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; max-width: 560px; margin: 0 auto; }

.piece.pop { animation: pop .42s cubic-bezier(.2, 1.4, .4, 1) both; }

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  unlockAudio();
  if (S && S.mode === 'paused' && $('ov').hidden) S.mode = 'play';
  if (!S || (S.mode !== 'play' && S.mode !== 'bomb' && S.mode !== 'catapult')) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (S.mode === 'catapult') {
    for (let i = 0; i < S.tray.length; i++) { const [tx, ty, s] = traySlotRect(i); if (x >= tx - 3 && x <= tx + s + 3 && y >= ty - 3 && y <= ty + s + 3) { if (S.tray[i] && !S.tray[i].park) catapult(S.tray[i]); return; } }
    for (let k = 0; k < S.cols.length; k++) { const [qx, qy, s] = queueItemPos(k, 0); if (Math.abs(x - qx) < G.colW / 2 && y > qy - s * .7 && y < qy + s * 1.6) { if (S.cols[k].length) catapult(S.cols[k][0]); return; } }
    S.mode = 'play'; hud(); return; // tapped elsewhere: put the catapult down
  }
  if (S.mode === 'bomb') {
    const c = Math.floor((x - G.bx) / G.cell), rr_ = Math.floor((y - G.by) / G.cell);
    if (c >= 0 && rr_ >= 0 && c < S.C && rr_ < S.R && bomb(rr_, c)) { S.mode = 'play'; hud(); }
    else if (!(c >= -1 && rr_ >= -1 && c <= S.C && rr_ <= S.R)) { S.mode = 'play'; hud(); }
    return;
  }
  for (let i = 0; i < S.tray.length; i++) { const [tx, ty, s] = traySlotRect(i); if (x >= tx - 3 && x <= tx + s + 3 && y >= ty - 3 && y <= ty + s + 3) { tapTray(i); return; } }

});

    + `<h3>Runestone</h3>` + runeRow() + `<h3>Chests for the Longhouse</h3>` + Object.keys(KEY_PRICE).map(k => `<div class="hbrow"><div class="ic">\u{1F4E6}</div><div class="txt"><b>${CHEST_NAME[k][0].toUpperCase() + CHEST_NAME[k].slice(1)} <span style="color:var(--mute);font-weight:500">${SAGA.chests[k] || 0} held</span></b><small>${tokRange(k)}</small></div><button class="boost" data-k="${k}" ${SAGA.silver < keyCost(k) ? 'disabled' : ''}>Buy<small>${fmtN(keyCost(k))} silver</small></button></div>`).join('');
  $('hbList').querySelectorAll('[data-b]').forEach(b => b.onclick = () => +b.dataset.b < 0 ? hbTapUp() : hbBuy(+b.dataset.b));
  $('hbList').querySelectorAll('[data-k]').forEach(b => b.onclick = () => hbKey(b.dataset.k));
  $('hbList').querySelectorAll('[data-boon]').forEach(b => b.onclick = () => hbBoon(b.dataset.boon));
  const rb = $('runeBtn'); if (rb) rb.onclick = () => showCard('rune');
}
let hbPending = { away: Date.now() - (HB.last || Date.now()), got: hbSettle() }; // banked while the game was closed; the Harbor screen tells the tale

window.JB = { get S() { return S; }, showHome, playHome, placePending, raiseRune, runeReady, HB, hbBoon, BOONS, openHB, closeHB, hbBuy, hbSettle, hbRate, LH, HALLS, openLH, closeLH, openChest, lhDrop, deliver, tribute, sell, lhRender, SAGA, STATS, ACH, checkAch, win, lose, update, tapQueue, tapTray, queueItemPos, catapult, showCard, startLevel, save, buildLevel, exposed, solvable, planShips, lapHits, composeScene, difficulty, parseGrid, rngFrom };
// the same four-tab bar as the home screen, on the Longhouse and Harbor; built fresh on each open so the chest count is current
function buildTabs(host, active) {
  host.innerHTML = '';
  [['raids', 'hHome', 'Raids'], ['lh', 'hLH', 'Longhouse'], ['hb', 'hHB', 'Harbor'], ['saga', 'hSaga', 'Saga']].forEach(([k, id, label]) => {
    const b = document.createElement('button'); b.className = 'tab' + (k === active ? ' on' : ''); b.dataset.k = k;
    b.innerHTML = `<span class="ic">${$(id).querySelector('.ic').innerHTML}</span>${label}` + (k === 'lh' && chestCount() ? `<span class="n">${chestCount()}</span>` : '');
    b.onclick = () => tabGo(k, active); host.appendChild(b);
  });
}
function tabGo(k, from) {
  if (k === from) return;
  if (k === 'saga') { showCard('saga'); return; }
  if (from === 'lh') { $('lh').hidden = true; persist(); if (S) { S.slotBoosts = LH.tokens > 0 && S.tray.length < 6 ? 1 : 0; hud(); } }
  if (from === 'hb') { hbSettle(); persist(); clearInterval(hbTimer); $('hb').hidden = true; }
  lhFrom = null; homeOpen = false;
  if (k === 'raids') showHome();
  else if (k === 'lh') { homeOpen = true; openLH('home'); }
  else if (k === 'hb') { homeOpen = true; openHB(); }
}
// boot last, once every section above (Longhouse, Harbor, home) is defined: the home screen reads them
startLevel(save.level);
if (!save.seenHelp) showCard('help'); else showHome();
requestAnimationFrame(frame);
})();
</script>

    let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded) return; reloaded=true; location.reload(); });
  });
}
