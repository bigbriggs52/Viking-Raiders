<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;background:#d6e4ec}[hidden]{display:none!important}</style>
<title>Viking Raiders</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viking Raiders">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#d6e4ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen raid. Rune strip on top, shield wall ringed by a fjord, docks, the harbor queue, a wooden button bar. */
:root {
  --ink: #d6e4ec;        /* morning sky over the fjord */
  --syrup: #f3e9d2;      /* parchment panels */
  --syrup-hi: #e3d3b0;   /* raised panels */
  --wood: #6b4a2e;       /* timber */
  --wood-hi: #8d6540;
  --cream: #2b2118;      /* ink-brown text */
  --mute: #6b5a48;       /* secondary text */
  --lemon: #c9922a;      /* gold accent */
  --danger: #c0392b;
  --display: 'Metamorphous', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --body: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  background: var(--ink); color: var(--cream); font-family: var(--body);
  overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#app { height: var(--vh, 100%); max-width: 560px; margin: 0 auto; padding-inline: 10px; padding-block: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; position: relative; }
.hud { display: flex; align-items: center; gap: 10px; }
.lvl { font-family: var(--display); font-size: 19px; letter-spacing: .02em; white-space: nowrap; color: var(--lemon); }
.bar { flex: 1; min-width: 0; height: 12px; background: #b9cbd6; border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.15); }
.bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #8d6540, var(--lemon)); border-radius: 99px; transition: width .25s; }
.chip { font-size: 13px; font-weight: 800; padding: 4px 9px; border-radius: 99px; background: var(--wood); color: #f3e9d2; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.easy { background: #2f7a4a; color: #e9ffe9; }
.iconbtn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--wood); color: #f3e9d2; font: 800 15px var(--body); cursor: pointer; flex: none; }
.stage { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
* { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.boosters { display: flex; gap: 8px; }
.boost { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 14px; border: 0; cursor: pointer;
  background: linear-gradient(var(--wood-hi), var(--wood)); color: #f3e9d2; font: 800 15px var(--body); box-shadow: 0 4px 0 #3d2a18; }
.boost:active { transform: translateY(2px); box-shadow: 0 2px 0 #3d2a18; }
.boost b { font-family: var(--display); font-weight: 400; font-size: 16px; color: #ffd37a; font-variant-numeric: tabular-nums; }
.boost.on { background: var(--lemon); color: #2b2118; }
.boost.on b { color: #2b2118; }
.boost[disabled] { opacity: .4; }
button:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 60, 80, .55); padding-inline: 16px; z-index: 5; }
.card { width: 100%; max-width: 360px; background: var(--syrup); border: 3px solid var(--wood-hi); border-radius: 18px; padding: 24px 22px; text-align: center; box-shadow: 0 10px 0 #4a3220; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.05; text-wrap: balance; color: var(--lemon); }
.card p { margin: 0; color: var(--mute); font-size: 16px; line-height: 1.45; }
.card ul { margin: 0; padding: 0; list-style: none; text-align: left; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.4; }
.card li { display: flex; gap: 10px; }
.card li span { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--wood); font-weight: 800; font-size: 12px; color: #ffd37a; }
.cta { border: 0; border-radius: 14px; padding: 14px; font: 400 19px var(--display); letter-spacing: .02em; background: var(--lemon); color: #2b2118; cursor: pointer; box-shadow: 0 5px 0 #8c6a20; }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 #8c6a20; }
.link { background: none; border: 0; color: var(--mute); font: 800 14px var(--body); cursor: pointer; padding: 4px; }
.toast { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #2f7a4a; color: #f1fff3; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 12px; max-width: calc(100% - 20px); text-align: center; z-index: 4; transition: opacity .4s; pointer-events: none; box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>


<div id="app">
  <div class="hud">
    <div class="lvl" id="lvl">Raid 1</div>
    <div class="bar" aria-label="Shields smashed"><i id="prog"></i></div>
    <div class="chip" id="try">Try 1</div>
    <button class="iconbtn" id="mute" aria-label="Sound on or off">♪</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="boosters">
    <button class="boost" id="bBomb">Hammer <b id="nBomb">1</b></button>
    <button class="boost" id="bSlot" hidden>+1 Dock <b id="nSlot">1</b></button>
    <button class="boost" id="bRestart">Retreat</button>
  </div>
  <div class="overlay" id="ov">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
(() => {

const MOTIFS = {"main":[{"name":"Axe","rows":["....bb....","...bbbb...","..bbbbbb..","..bbbbbb..","...bbaa...",".....aa...",".....aa...",".....aa...",".....aa...",".....aa...",".....aa...",".....aa..."]},{"name":"Longship","rows":[".........c","........cc",".......ccc","...bbbbcc.","..bbbbbcc.","..bbbbbcc.","...bbbbcc.",".....a.cc.","aaaaaaaaaa",".aaaaaaaa.","..aaaaaa..","...aaaa..."]},{"name":"Helmet","rows":[".c......c.","cc......cc","cc.bbbb.cc","cc.bbbb.cc",".cbbbbbbc.","..bbbbbb..","..bbbbbb..","..aaaaaa..","..abbbba..","..ab.bba..","..ab..ba..","..bb..bb.."]},{"name":"Shield","rows":["...aaaa...","..abbbba..",".abbbbbba.","abbbccbbba","abbccccbba","abbccccbba","abbbccbbba",".abbbbbba.","..abbbba..","...aaaa..."]},{"name":"Hammer","rows":[".bbbbbbbb.",".bbbbbbbb.",".bbbbbbbb.",".bbbbbbbb.",".bbbbbbbb.","....aa....","....aa....","....aa....","....aa....","....aa....","...ccaa...","...cccc..."]},{"name":"Drinking Horn","rows":[".......bb.","......bccb",".....bcccb","....bccccb","...bccccb.","..bccccb..",".bccccb...",".bcccb....",".bccb.....","..bb......","..aa......","..aa......",".aa......."]},{"name":"Raven","rows":[".....aaa..","....aaaab.","...aaaaab.","..aaaaaa..",".aaaaaaa..","aaaaaaaaa.",".aaaaaaaa.","..aaaaaa..","...aaaa...","....aa.a..","....a..a..","...cc..cc."]},{"name":"Rune Stone","rows":["..bbbbbb..",".bbbbbbbb.",".bbacabbb.",".bbacabbb.",".bbbaabbb.",".bbbaabbb.",".bbaabbbb.",".bbaababb.",".bbaaabbb.",".bbaaabbb.",".bbbbbbbb.",".bbbbbbbb.","cccccccccc"]},{"name":"Dragon Prow","rows":[".....dd...","....dddd..","...ddbbdd.","...dbbbbd.","...dbcbbd.","...dbbbbd.","..dddbbbd.",".dddd.dd..",".ddd......",".ddd......","aaddaaaaaa","aaaaaaaaaa",".aaaaaaaa."]},{"name":"Sword","rows":["....bb....","....bb....","....bb....","....bb....","....bb....","....bb....","....bb....","....bb....","cccccccccc","cccccccccc","....aa....","....aa....","....aa....","...dddd..."]},{"name":"Wolf","rows":["..b....b..",".bbb..bbb.",".aaaaaaaa.",".aaaaaaaa.","aacaaaacaa","aaaaa ","a..aaa..a","..aaaaa..",".a.a.a.a.","..a...a.."]},{"name":"Whale","rows":[".......aa.","....aaaaa.",".aaaaaaaa.","aabaaaaaa.","aaaaaaaa..",".aaaaaa...","...aaaa..."]},{"name":"Bear","rows":[".aa..aa.","aaaaaaaa","abaaaaba","aaaaaaaa",".aaccaa.","..aaaa.."]},{"name":"Wolf","rows":["a......a","aa....aa","aaaaaaaa","aabaabaa",".aaaaaa.","..aacaa."]},{"name":"Horse","rows":["......aa..",".....aaaa.","aaaaaaaaa.","aaaaaaaa..",".aaaaaaa..",".aa..aa...",".aa..aa..."]},{"name":"Deer","rows":["a.a....a.a",".aa....aa.","..bbbbbb..","..bcbbcb..","..bbbbbb..","..bb..bb..","..bb..bb.."]},{"name":"Torch","rows":[".a..","aaa.",".a..",".b..",".b..",".b.."]},{"name":"Scroll","rows":["aaaaaaaa","abbbbbba","abcbcbba","abbbbbba","abcbbcba","abbbbbba","aaaaaaaa"]},{"name":"Cup","rows":["aaaaaaaa",".aaaaaa.","..aaaa..","...bb...","..bbbb.."]},{"name":"Wave","rows":["a.......a.","aa.....aa.",".aa...aa..","..aaaaa..."]},{"name":"Compass","rows":["....a....","...aba...","..abbba..",".abbbbba.","aaaaaaaaa",".abbbbba.","..abbba..","...aba...","....a...."]},{"name":"Heart","rows":[".aa..aa.","aaaaaaaa","aaaaaaaa",".aaaaaa.","..aaaa..","...aa..."]},{"name":"Hammer","rows":[".aaaaaa.",".aaaaaa.","...bb...","...bb...","...bb...","..cccc.."]}],"sky":[{"name":"Sun","rows":[".aa.","aaaa","aaaa",".aa."]},{"name":"Moon","rows":[".aa.","aa..","aa..",".aa."]},{"name":"Star","rows":[".a.","aaa",".a."]},{"name":"Bird","rows":["a..a",".aa."]},{"name":"Cloud","rows":[".aaa.","aaaaa"]},{"name":"Raven","rows":["..aa","aaaa",".aa."]}],"obj":[{"name":"Tree","rows":[".aa.","aaaa","aaaa",".bb."]},{"name":"Rock","rows":[".aaa.","aaaaa"]},{"name":"Tent","rows":["..a..",".aaa.","aaaaa"]},{"name":"Barrel","rows":[".aa.","abba","abba",".aa."]},{"name":"Shield Post","rows":[".aa.","abba",".aa.",".c.."]},{"name":"Fire","rows":[".a.","bab","bbb"]}],"strip":[{"name":"Sea","rows":["a.a.a.a.a.","aaaaaaaaaa"]},{"name":"Grass","rows":[".a..a..a..","aaaaaaaaaa"]},{"name":"Mountains","rows":["..a....a..",".aaa..aaa.","aaaaaaa // ---------- seeded rng ----------
function rngFrom(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));

function proceduralGrid(n, rng) {
  // portrait boards: phones are taller than wide, so the wall grows downward more than sideways
  const C = Math.min(10, 7 + Math.floor(n / 4)), R = Math.min(14, C + 2 + ri(rng, 0, 2));
  const k = Math.min(2 + Math.floor((n + 1) / 4), 6);
  const pool = PROC_COLORS.slice().sort(() => rng() - .5).slice(0, k);
  const type = (n < 12 ? [0, 2, 5] : n < 20 ? [0, 2, 5, 1] : [0, 0, 2, 2, 5, 5, 1, 3, 4])[ri(rng, 0, n < 12 ? 2 : n < 20 ? 3 : 8)], cx = (C - 1) / 2, cy = (R - 1) / 2;
  const seeds = Array.from({ length: k * 2 }, () => [rng() * C, rng() * R]);
  const sw = ri(rng, 1, 2), mask = ri(rng, 0, 2), noise = Math.max(0, Math.min(.02 + (n - 10) * .006, .12));
  const g = [];
  for (let r = 0; r < R; r++) { const row = []; for (let c = 0; c < C; c++) {
    const dx = c - cx, dy = r - cy; let idx;
    if (type === 0) idx = Math.floor(Math.max(Math.abs(dx), Math.abs(dy)) / sw);
    else if (type === 1) idx = Math.floor((c + r) / (sw + 1));
    else if (type === 2) idx = Math.floor((Math.abs(dx) + Math.abs(dy)) / (sw + .5));
    else if (type === 3) { let best = 1e9; seeds.forEach((s, i) => { const d = (s[0] - c) ** 2 + (s[1] - r) ** 2; if (d < best) { best = d; idx = i; } }); }
    else if (type === 4) idx = (Math.floor(c / (sw + 1)) + Math.floor(r / (sw + 1)) * 2);
    else idx = Math.floor(Math.hypot(dx, dy) / (sw + .4));
    let ch = rng() < noise ? pool[ri(rng, 0, k - 1)] : pool[idx % k];
    if (mask === 1 && dx * dx / (cx + .6) ** 2 + dy * dy / (cy + .6) ** 2 > 1) ch = '.';
    if (mask === 2 && Math.abs(dx) + Math.abs(dy) > Math.max(cx, cy) + 1.5) ch = '.';
    row.push(ch);
  } g.push(row.join('')); }
  return g;
}

function parseGrid(rows) {
  const C = Math.max(...rows.map(r => r.length));
  let g = rows.map(r => r.padEnd(C, '.').split('').map(ch => ch === '.' ? null : ch));
  g = g.filter(r => r.some(Boolean));
  const used = c => g.some(r => r[c]);
  let c0 = 0, c1 = C - 1; while (c0 < c1 && !used(c0)) c0++; while (c1 > c0 && !used(c1)) c1--;
  return g.map(r => r.slice(c0, c1 + 1));
}

// cells reachable by a shot from any side
function exposed(g) {
  const R = g.length, C = g[0].length, out = new Set();
  for (let c = 0; c < C; c++) {
    for (let r = R - 1; r >= 0; r--) if (g[r][c]) { out.add(r * C + c); break; }
    for (let r = 0; r < R; r++) if (g[r][c]) { out.add(r * C + c); break; }
  }
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) if (g[r][c]) { out.add(r * C + c); break; }
    for (let c = C - 1; c >= 0; c--) if (g[r][c]) { out.add(r * C + c); break; }
  }
  return out;
}

// Plan the ship order: peel the picture wave by wave. Each ship only carries axes for shields
// that show at the same time, so a ship sent at the right moment always spends everything.
// One lap of the fjord, exactly as the game plays it: the ship passes every lane once, in belt order,
// and throws at the first shield in each lane when it carries its color. Returns the hits in order.
function lapHits(g0, ice0, color, ammo, apply) {
  // a corner shield is first in two lanes, so even a dry run must remove what it hits: work on copies
  const g = apply ? g0 : g0.map(r => r.slice()), ice = apply ? ice0 : new Set(ice0);
  const R = g.length, C = g[0].length, lanes = [];
  for (let c = 0; c < C; c++) lanes.push(['b', c]);
  for (let r = R - 1; r >= 0; r--) lanes.push(['r', r]);
  for (let c = C - 1; c >= 0; c--) lanes.push(['t', c]);
  for (let r = 0; r < R; r++) lanes.push(['l', r]);
  const first = ([side, i]) => {
    if (side === 'b') { for (let r = R - 1; r >= 0; r--) if (g[r][i]) return r * C + i; }
    else if (side === 't') { for (let r = 0; r < R; r++) if (g[r][i]) return r * C + i; }
    else if (side === 'l') { for (let c = 0; c < C; c++) if (g[i][c]) return i * C + c; }
    else { for (let c = C - 1; c >= 0; c--) if (g[i][c]) return i * C + c; }
    return -1;
  };
  const hits = []; let axes = ammo;
  for (const lane of lanes) {
    if (axes <= 0) break;
    const idx = first(lane); if (idx < 0 || g[Math.floor(idx / C)][idx % C] !== color) continue;
    if (ice.has(idx)) { axes--; hits.push({ idx, crack: true }); ice.delete(idx); if (axes <= 0) break; }
    axes--; hits.push({ idx }); g[Math.floor(idx / C)][idx % C] = null;
  }
  return hits;
}
// Plan the harbor: ships are cut so that, sent in the planned order, each one spends everything in a single
// lap. When no color can fill a whole ship, the planned ship comes home once and sails again later (a dock use).
function planShips(grid, ice0, minAmmo, rng, docks, maxAmmo) {
  maxAmmo = Math.max(minAmmo + 4, maxAmmo || 0);
  const g = grid.map(r => r.slice()), ice = new Set(ice0), C = g[0].length, list = [], waiting = [];
  const count = () => { let k = 0; g.forEach(r => r.forEach(v => { if (v) k++; })); return k; };

// ---------- difficulty curve over 1000 raids: a steady climb with a breather every 7th raid and a hard one every 25th ----------
